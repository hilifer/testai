name: Get FXCM Token

on:
  workflow_dispatch:
  push:
    branches: [claude/fix-demo-database-b3FtT]
    paths:
      - '.github/workflows/get-fxcm-token.yml'

jobs:
  get-token:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fix-demo-database-b3FtT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Login to FXCM Trading Station and get token
        run: |
          python3 << 'PYEOF'
          import json, time, requests
          from playwright.sync_api import sync_playwright

          log = []
          def p(msg):
              print(msg)
              log.append(str(msg))

          USERNAME = "D103538926"
          PASSWORD = "cqa7U"

          p("=" * 60)
          p("STEP 1: Open Trading Station Web")
          p("=" * 60)

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  viewport={"width": 1920, "height": 1080}
              )
              page = context.new_page()

              try:
                  # Navigate to Trading Station
                  p("Navigating to tradingstation.fxcm.com...")
                  page.goto("https://tradingstation.fxcm.com/", timeout=60000)
                  time.sleep(3)
                  p(f"Current URL: {page.url}")
                  p(f"Title: {page.title()}")

                  # Take screenshot
                  page.screenshot(path="screenshot_1_landing.png")
                  p("Screenshot 1 saved")

                  # Switch to Demo tab first (account starts with D)
                  p("\nSwitching to Demo tab...")
                  demo_selectors = [
                      'text=Demo',
                      'button:has-text("Demo")',
                      'a:has-text("Demo")',
                      'div:has-text("Demo")',
                      '[class*="demo" i]',
                  ]
                  for sel in demo_selectors:
                      try:
                          els = page.query_selector_all(sel)
                          for el in els:
                              txt = (el.text_content() or "").strip()
                              if txt.lower() == "demo":
                                  p(f"Clicking Demo tab: {sel} -> '{txt}'")
                                  el.click()
                                  time.sleep(2)
                                  break
                      except:
                          pass

                  page.screenshot(path="screenshot_1b_demo_tab.png")
                  p("Screenshot 1b saved (after Demo tab click)")
                  page.wait_for_load_state("networkidle", timeout=15000)

                  # Try to find login fields
                  html = page.content()

                  # Look for username/login input
                  login_selectors = [
                      'input[name="login"]',
                      'input[name="username"]',
                      'input[name="user"]',
                      'input[name="Login"]',
                      'input[id="login"]',
                      'input[id="username"]',
                      'input[type="text"]',
                      'input[placeholder*="user" i]',
                      'input[placeholder*="login" i]',
                      'input[placeholder*="account" i]',
                  ]

                  login_input = None
                  for sel in login_selectors:
                      try:
                          el = page.query_selector(sel)
                          if el and el.is_visible():
                              login_input = el
                              p(f"Found login input: {sel}")
                              break
                      except:
                          pass

                  password_selectors = [
                      'input[name="password"]',
                      'input[name="passwd"]',
                      'input[type="password"]',
                      'input[id="password"]',
                  ]

                  password_input = None
                  for sel in password_selectors:
                      try:
                          el = page.query_selector(sel)
                          if el and el.is_visible():
                              password_input = el
                              p(f"Found password input: {sel}")
                              break
                      except:
                          pass

                  if login_input and password_input:
                      p("\n--- Filling login form ---")
                      login_input.fill(USERNAME)
                      time.sleep(0.5)
                      password_input.fill(PASSWORD)
                      time.sleep(0.5)
                      page.screenshot(path="screenshot_2_filled.png")
                      p("Screenshot 2 saved (form filled)")

                      # Find and click submit
                      submit_selectors = [
                          'button:has-text("Sign in to Demo")',
                          'button:has-text("Sign in")',
                          'button[type="submit"]',
                          'input[type="submit"]',
                          'button:has-text("Login")',
                          'button:has-text("Log In")',
                          '#loginButton',
                          '.login-button',
                          'button.btn-primary',
                      ]

                      for sel in submit_selectors:
                          try:
                              btn = page.query_selector(sel)
                              if btn and btn.is_visible():
                                  p(f"Clicking submit: {sel}")
                                  btn.click()
                                  break
                          except:
                              pass

                      # Wait for navigation
                      p("Waiting for login response...")
                      time.sleep(10)
                      page.wait_for_load_state("networkidle", timeout=30000)
                      p(f"Current URL after login: {page.url}")
                      p(f"Title: {page.title()}")
                      page.screenshot(path="screenshot_3_after_login.png")
                      p("Screenshot 3 saved (after login)")

                      # Check login
                      page_text = page.inner_text("body")
                      if "EQUITY" in page_text or "Equity" in page_text:
                          p("\nLOGIN SUCCESSFUL!")
                      else:
                          p("\nLogin may have failed.")
                          p(page_text[:500])

                      import re

                      # CAPTURE ALL AUTH DATA
                      p("\n--- Capturing auth data ---")

                      # 1. Cookies
                      cookies = context.cookies()
                      p(f"\nCookies ({len(cookies)}):")
                      for c in cookies:
                          p(f"  {c['name']}={c['value'][:80]}... (domain={c['domain']})")

                      # 2. LocalStorage & SessionStorage
                      p("\nLocalStorage:")
                      ls = page.evaluate("() => { let d={}; for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i); d[k]=localStorage.getItem(k);} return d; }")
                      for k, v in ls.items():
                          p(f"  {k}: {str(v)[:200]}")

                      p("\nSessionStorage:")
                      ss = page.evaluate("() => { let d={}; for(let i=0;i<sessionStorage.length;i++){let k=sessionStorage.key(i); d[k]=sessionStorage.getItem(k);} return d; }")
                      for k, v in ss.items():
                          p(f"  {k}: {str(v)[:200]}")

                      # 3. Look for tokens in JS variables
                      p("\nChecking JS globals for tokens...")
                      js_checks = [
                          "window.__FXCM_TOKEN__",
                          "window.accessToken",
                          "window.token",
                          "window.__SESSION__",
                          "window.__AUTH__",
                          "document.cookie",
                      ]
                      for js in js_checks:
                          try:
                              val = page.evaluate(f"() => {{ try {{ return {js} }} catch(e) {{ return null }} }}")
                              if val:
                                  p(f"  {js} = {str(val)[:300]}")
                          except:
                              pass

                      # 4. Intercept network requests - reload page and capture
                      p("\n--- Intercepting network requests ---")
                      captured = []
                      def handle_request(request):
                          url = request.url
                          headers = request.headers
                          if "fxcm" in url or "api" in url or "auth" in url or "token" in url:
                              entry = {"url": url, "method": request.method}
                              for h in ["authorization", "x-access-token", "x-auth-token", "bearer", "cookie"]:
                                  if h in headers:
                                      entry[h] = headers[h][:200]
                              captured.append(entry)

                      def handle_response(response):
                          url = response.url
                          if "token" in url.lower() or "auth" in url.lower() or "session" in url.lower():
                              try:
                                  body = response.text()
                                  captured.append({"resp_url": url, "status": response.status, "body": body[:500]})
                              except:
                                  pass

                      page.on("request", handle_request)
                      page.on("response", handle_response)

                      # Navigate back to main page to trigger API calls
                      page.goto("https://app.fxcm.com/desktop/", timeout=30000)
                      time.sleep(8)
                      page.wait_for_load_state("networkidle", timeout=15000)

                      p(f"\nCaptured {len(captured)} API requests:")
                      for c in captured:
                          p(f"  {json.dumps(c)[:300]}")

                      # 5. Scan all cookies/storage for token-like values
                      p("\n--- Scanning for access tokens ---")
                      all_values = []
                      for c in cookies:
                          all_values.append(("cookie:" + c["name"], c["value"]))
                      for k, v in ls.items():
                          all_values.append(("ls:" + k, str(v)))
                      for k, v in ss.items():
                          all_values.append(("ss:" + k, str(v)))

                      for name, val in all_values:
                          tokens = re.findall(r'[a-f0-9]{30,}', val)
                          if tokens:
                              p(f"\n*** POSSIBLE TOKEN in {name}: {tokens[0]} ***")

                      # 6. Try using captured session to call FXCM REST API directly
                      p("\n--- Testing FXCM REST API with captured session ---")
                      import requests as req_lib
                      session = req_lib.Session()
                      for c in cookies:
                          session.cookies.set(c["name"], c["value"], domain=c["domain"])

                      api_urls = [
                          "https://api-demo.fxcm.com:443/socket.io/?EIO=3&transport=polling",
                          "https://tradingstation.fxcm.com/api/account",
                      ]
                      for url in api_urls:
                          try:
                              resp = session.get(url, timeout=10,
                                  headers={"User-Agent": "Mozilla/5.0"})
                              p(f"[{resp.status_code}] GET {url}")
                              p(f"  Body: {resp.text[:300]}")
                          except Exception as e:
                              p(f"[ERROR] {url}: {e}")

                  else:
                      p("Could not find login form!")
                      p(f"\nPage HTML (first 3000 chars):\n{html[:3000]}")

                      # Maybe it's a SPA, try iframe
                      frames = page.frames
                      p(f"\nFrames: {len(frames)}")
                      for f in frames:
                          p(f"  Frame: {f.url}")

              except Exception as e:
                  p(f"\nERROR: {e}")
                  import traceback
                  p(traceback.format_exc())
                  page.screenshot(path="screenshot_error.png")

              finally:
                  browser.close()

          # Save results
          with open("fxcm_token_log.txt", "w") as f:
              f.write("\n".join(log))

          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxcm-screenshots
          path: screenshot_*.png

      - name: Push results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w 0 fxcm_token_log.txt)
          # Check if file exists
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt?ref=claude/fix-demo-database-b3FtT" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          if [ -n "$SHA" ]; then
            curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt" \
              -d "{\"message\":\"ci: FXCM token retrieval results\",\"content\":\"$CONTENT\",\"branch\":\"claude/fix-demo-database-b3FtT\",\"sha\":\"$SHA\"}"
          else
            curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt" \
              -d "{\"message\":\"ci: FXCM token retrieval results\",\"content\":\"$CONTENT\",\"branch\":\"claude/fix-demo-database-b3FtT\"}"
          fi
