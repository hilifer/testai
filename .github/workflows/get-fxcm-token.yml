name: Get FXCM Token

on:
  workflow_dispatch:
  push:
    branches: [claude/fix-demo-database-b3FtT]
    paths:
      - '.github/workflows/get-fxcm-token.yml'

jobs:
  get-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fix-demo-database-b3FtT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Login and find Token Management
        run: |
          python3 << 'PYEOF'
          import json, time, re
          from playwright.sync_api import sync_playwright

          log = []
          def p(msg):
              print(msg)
              log.append(str(msg))

          USERNAME = "D103538926"
          PASSWORD = "cqa7U"

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0",
                  viewport={"width": 1920, "height": 1080}
              )
              page = context.new_page()

              try:
                  # Login
                  page.goto("https://tradingstation.fxcm.com/", timeout=60000)
                  time.sleep(3)
                  page.wait_for_load_state("networkidle", timeout=30000)
                  p(f"URL: {page.url}")

                  # Click Demo tab
                  demo = page.query_selector('text=Demo')
                  if demo:
                      demo.click()
                      time.sleep(1)

                  # Fill login
                  page.fill('input[name="username"]', USERNAME)
                  page.fill('input[name="password"]', PASSWORD)
                  page.click('button:has-text("Sign in")')
                  time.sleep(10)
                  page.wait_for_load_state("networkidle", timeout=30000)
                  p(f"After login URL: {page.url}")

                  # Verify login
                  body = page.inner_text("body")
                  if "EQUITY" in body or "Equity" in body:
                      p("LOGIN OK!")
                  else:
                      p("Login failed")
                      p(body[:500])

                  page.screenshot(path="ss_loggedin.png")

                  # FULL PAGE HTML DUMP - find all elements in top area
                  p("\n=== FULL HTML SCAN FOR TOKEN/ACCOUNT MENUS ===")
                  html = page.content()

                  # Find anything related to token, account, user, settings, profile
                  patterns = [
                      r'[Tt]oken',
                      r'[Aa]ccount',
                      r'[Ss]etting',
                      r'[Pp]rofile',
                      r'[Uu]ser',
                      r'D103538926',
                      r'03528078',
                      r'[Mm]anage',
                      r'[Pp]reference',
                  ]
                  for pat in patterns:
                      matches = re.findall(f'.{{0,80}}{pat}.{{0,80}}', html)
                      if matches:
                          p(f"\nPattern '{pat}' found {len(matches)} times:")
                          for m in matches[:5]:
                              clean = re.sub(r'<[^>]+>', ' ', m).strip()
                              p(f"  ...{clean[:150]}...")

                  # List ALL elements with text in the top 200px area
                  p("\n=== ELEMENTS IN TOP AREA ===")
                  top_elements = page.evaluate("""() => {
                      const els = document.querySelectorAll('*');
                      const result = [];
                      for (const el of els) {
                          const rect = el.getBoundingClientRect();
                          if (rect.top < 200 && rect.height > 0 && rect.width > 0) {
                              const text = el.textContent?.trim().substring(0, 100);
                              const tag = el.tagName;
                              const cls = el.className?.toString().substring(0, 80);
                              const id = el.id;
                              if (text && text.length > 0 && text.length < 80) {
                                  result.push({tag, id, cls, text});
                              }
                          }
                      }
                      return result.slice(0, 60);
                  }""")
                  for el in top_elements:
                      p(f"  <{el['tag']} id='{el['id']}' class='{el['cls']}'> {el['text']}")

                  # Try clicking account number in top area
                  p("\n=== CLICKING TOP AREA ELEMENTS ===")
                  # Click the account number
                  acct_el = page.query_selector('text=03528078')
                  if acct_el:
                      p("Clicking 03528078...")
                      acct_el.click()
                      time.sleep(2)
                      page.screenshot(path="ss_after_acct_click.png")
                      # Check for dropdown/menu
                      new_body = page.inner_text("body")
                      p(f"After click text (first 1000):\n{new_body[:1000]}")
                      if "token" in new_body.lower():
                          p("\n*** TOKEN MANAGEMENT FOUND! ***")
                          # Click Token Management
                          tm = page.query_selector('text=Token Management') or page.query_selector('text=Token')
                          if tm:
                              tm.click()
                              time.sleep(2)
                              page.screenshot(path="ss_token_mgmt.png")
                              tm_text = page.inner_text("body")
                              p(f"Token Management page:\n{tm_text[:2000]}")

                              # If there's a password prompt, fill it
                              pw_input = page.query_selector('input[type="password"]')
                              if pw_input:
                                  p("Found password prompt, filling...")
                                  pw_input.fill(PASSWORD)
                                  # Click generate/submit
                                  gen_btn = page.query_selector('button:has-text("Generate")') or page.query_selector('button[type="submit"]')
                                  if gen_btn:
                                      gen_btn.click()
                                      time.sleep(3)
                                      page.screenshot(path="ss_token_generated.png")
                                      final = page.inner_text("body")
                                      p(f"After generate:\n{final[:2000]}")
                                      tokens = re.findall(r'[a-f0-9]{30,}', page.content())
                                      if tokens:
                                          p(f"\n*** ACCESS TOKEN: {tokens[0]} ***")

                  # Try ALL SVG/icon buttons (settings gear, user icon etc)
                  p("\n=== TRYING SVG/ICON BUTTONS ===")
                  icons = page.query_selector_all("svg, [class*='icon'], [class*='Icon'], [class*='menu'], [class*='Menu'], [class*='header'] button, [class*='nav'] button, [class*='toolbar'] button")
                  p(f"Found {len(icons)} icon elements")
                  for idx, icon in enumerate(icons[:15]):
                      try:
                          if icon.is_visible():
                              box = icon.bounding_box()
                              if box and box['y'] < 100:
                                  p(f"  Clicking icon #{idx} at y={box['y']:.0f}")
                                  icon.click()
                                  time.sleep(1)
                                  new_text = page.inner_text("body")
                                  if "token" in new_text.lower() or "management" in new_text.lower():
                                      p(f"  *** FOUND TOKEN MENU after icon #{idx}! ***")
                                      p(new_text[:1000])
                                      page.screenshot(path=f"ss_icon_{idx}.png")
                                      break
                      except:
                          pass

              except Exception as e:
                  p(f"ERROR: {e}")
                  import traceback
                  p(traceback.format_exc())
                  page.screenshot(path="ss_error.png")
              finally:
                  browser.close()

          with open("fxcm_token_log.txt", "w") as f:
              f.write("\n".join(log))
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxcm-screenshots
          path: ss_*.png

      - name: Push results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w 0 fxcm_token_log.txt)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt?ref=claude/fix-demo-database-b3FtT" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt" \
              -d "{\"message\":\"ci: FXCM token log\",\"content\":\"$CONTENT\",\"branch\":\"claude/fix-demo-database-b3FtT\",\"sha\":\"$SHA\"}"
          else
            curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt" \
              -d "{\"message\":\"ci: FXCM token log\",\"content\":\"$CONTENT\",\"branch\":\"claude/fix-demo-database-b3FtT\"}"
          fi
