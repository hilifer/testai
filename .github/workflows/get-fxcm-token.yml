name: Get FXCM Token

on:
  workflow_dispatch:
  push:
    branches: [claude/fix-demo-database-b3FtT]
    paths:
      - '.github/workflows/get-fxcm-token.yml'

jobs:
  get-token:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fix-demo-database-b3FtT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Login to FXCM Trading Station and get token
        run: |
          python3 << 'PYEOF'
          import json, time, requests
          from playwright.sync_api import sync_playwright

          log = []
          def p(msg):
              print(msg)
              log.append(str(msg))

          USERNAME = "D103538926"
          PASSWORD = "cqa7U"

          p("=" * 60)
          p("STEP 1: Open Trading Station Web")
          p("=" * 60)

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  viewport={"width": 1920, "height": 1080}
              )
              page = context.new_page()

              try:
                  # Navigate to Trading Station
                  p("Navigating to tradingstation.fxcm.com...")
                  page.goto("https://tradingstation.fxcm.com/", timeout=60000)
                  time.sleep(3)
                  p(f"Current URL: {page.url}")
                  p(f"Title: {page.title()}")

                  # Take screenshot
                  page.screenshot(path="screenshot_1_landing.png")
                  p("Screenshot 1 saved")

                  # Switch to Demo tab first (account starts with D)
                  p("\nSwitching to Demo tab...")
                  demo_selectors = [
                      'text=Demo',
                      'button:has-text("Demo")',
                      'a:has-text("Demo")',
                      'div:has-text("Demo")',
                      '[class*="demo" i]',
                  ]
                  for sel in demo_selectors:
                      try:
                          els = page.query_selector_all(sel)
                          for el in els:
                              txt = (el.text_content() or "").strip()
                              if txt.lower() == "demo":
                                  p(f"Clicking Demo tab: {sel} -> '{txt}'")
                                  el.click()
                                  time.sleep(2)
                                  break
                      except:
                          pass

                  page.screenshot(path="screenshot_1b_demo_tab.png")
                  p("Screenshot 1b saved (after Demo tab click)")
                  page.wait_for_load_state("networkidle", timeout=15000)

                  # Try to find login fields
                  html = page.content()

                  # Look for username/login input
                  login_selectors = [
                      'input[name="login"]',
                      'input[name="username"]',
                      'input[name="user"]',
                      'input[name="Login"]',
                      'input[id="login"]',
                      'input[id="username"]',
                      'input[type="text"]',
                      'input[placeholder*="user" i]',
                      'input[placeholder*="login" i]',
                      'input[placeholder*="account" i]',
                  ]

                  login_input = None
                  for sel in login_selectors:
                      try:
                          el = page.query_selector(sel)
                          if el and el.is_visible():
                              login_input = el
                              p(f"Found login input: {sel}")
                              break
                      except:
                          pass

                  password_selectors = [
                      'input[name="password"]',
                      'input[name="passwd"]',
                      'input[type="password"]',
                      'input[id="password"]',
                  ]

                  password_input = None
                  for sel in password_selectors:
                      try:
                          el = page.query_selector(sel)
                          if el and el.is_visible():
                              password_input = el
                              p(f"Found password input: {sel}")
                              break
                      except:
                          pass

                  if login_input and password_input:
                      p("\n--- Filling login form ---")
                      login_input.fill(USERNAME)
                      time.sleep(0.5)
                      password_input.fill(PASSWORD)
                      time.sleep(0.5)
                      page.screenshot(path="screenshot_2_filled.png")
                      p("Screenshot 2 saved (form filled)")

                      # Find and click submit
                      submit_selectors = [
                          'button:has-text("Sign in to Demo")',
                          'button:has-text("Sign in")',
                          'button[type="submit"]',
                          'input[type="submit"]',
                          'button:has-text("Login")',
                          'button:has-text("Log In")',
                          '#loginButton',
                          '.login-button',
                          'button.btn-primary',
                      ]

                      for sel in submit_selectors:
                          try:
                              btn = page.query_selector(sel)
                              if btn and btn.is_visible():
                                  p(f"Clicking submit: {sel}")
                                  btn.click()
                                  break
                          except:
                              pass

                      # Wait for navigation
                      p("Waiting for login response...")
                      time.sleep(10)
                      page.wait_for_load_state("networkidle", timeout=30000)
                      p(f"Current URL after login: {page.url}")
                      p(f"Title: {page.title()}")
                      page.screenshot(path="screenshot_3_after_login.png")
                      p("Screenshot 3 saved (after login)")

                      # Check if login succeeded by looking for account data
                      page_text = page.inner_text("body")
                      if "EQUITY" in page_text or "Equity" in page_text:
                          p("\nLOGIN SUCCESSFUL! Account data visible.")
                      else:
                          p("\nLogin may have failed. Page text:")
                          p(page_text[:1000])

                      # Find Token Management - try account menu in top right
                      p("\n--- Looking for Token Management ---")

                      # First dump all clickable elements to find the menu
                      import re
                      all_buttons = page.query_selector_all("button, a, [role='button'], [role='menuitem']")
                      p(f"Found {len(all_buttons)} clickable elements")
                      for btn in all_buttons:
                          try:
                              txt = (btn.text_content() or "").strip()[:80]
                              if txt and btn.is_visible():
                                  p(f"  Clickable: '{txt}'")
                          except:
                              pass

                      # Look for user/account menu icon (usually top-right)
                      menu_selectors = [
                          'text=Token Management',
                          'text=Token',
                          '[aria-label*="user" i]',
                          '[aria-label*="account" i]',
                          '[aria-label*="menu" i]',
                          '[aria-label*="settings" i]',
                          '[class*="user-menu" i]',
                          '[class*="avatar" i]',
                          '[class*="profile" i]',
                          'text=Settings',
                          'text=Account',
                          'text=User Account',
                          'svg[class*="user" i]',
                          'img[alt*="user" i]',
                          # FXCM-specific: account number in top area
                          f'text=03528078',
                          f'text=D103538926',
                      ]

                      for sel in menu_selectors:
                          try:
                              el = page.query_selector(sel)
                              if el and el.is_visible():
                                  p(f"\nClicking menu: {sel} -> '{(el.text_content() or '')[:60]}'")
                                  el.click()
                                  time.sleep(2)
                                  page.screenshot(path="screenshot_4_menu.png")
                                  p("Screenshot 4 saved")

                                  # Check for Token option in dropdown
                                  after_text = page.inner_text("body")
                                  if "token" in after_text.lower():
                                      p("TOKEN found in page after click!")
                                      p(after_text[:2000])

                                      # Try to click Token Management
                                      token_link = page.query_selector('text=Token Management') or page.query_selector('text=Token')
                                      if token_link:
                                          token_link.click()
                                          time.sleep(3)
                                          page.screenshot(path="screenshot_5_token_mgmt.png")
                                          p("Screenshot 5 saved (Token Management page)")
                                          token_page = page.inner_text("body")
                                          p(f"Token page text:\n{token_page[:3000]}")

                                          # Extract token
                                          tokens = re.findall(r'[a-f0-9]{30,}', page.content())
                                          if tokens:
                                              p(f"\n*** TOKEN FOUND: {tokens[0]} ***")
                                          break
                          except:
                              pass

                      # Also scan full HTML for token patterns
                      full_html = page.content()
                      tokens = re.findall(r'[a-f0-9]{30,}', full_html)
                      if tokens:
                          p(f"\nTokens in HTML: {tokens[:5]}")

                      # Try direct navigation to token management URL
                      p("\n--- Trying direct URL for token management ---")
                      possible_urls = [
                          "https://app.fxcm.com/desktop/token",
                          "https://app.fxcm.com/desktop/settings",
                          "https://app.fxcm.com/desktop/account",
                          "https://app.fxcm.com/desktop/api",
                      ]
                      for url in possible_urls:
                          try:
                              page.goto(url, timeout=15000)
                              time.sleep(2)
                              p(f"[{page.url}] -> title: {page.title()}")
                              txt = page.inner_text("body")[:500]
                              p(f"  Content: {txt}")
                              tokens = re.findall(r'[a-f0-9]{30,}', page.content())
                              if tokens:
                                  p(f"  *** TOKEN: {tokens[0]} ***")
                          except Exception as e:
                              p(f"  Error: {e}")

                  else:
                      p("Could not find login form!")
                      p(f"\nPage HTML (first 3000 chars):\n{html[:3000]}")

                      # Maybe it's a SPA, try iframe
                      frames = page.frames
                      p(f"\nFrames: {len(frames)}")
                      for f in frames:
                          p(f"  Frame: {f.url}")

              except Exception as e:
                  p(f"\nERROR: {e}")
                  import traceback
                  p(traceback.format_exc())
                  page.screenshot(path="screenshot_error.png")

              finally:
                  browser.close()

          # Save results
          with open("fxcm_token_log.txt", "w") as f:
              f.write("\n".join(log))

          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxcm-screenshots
          path: screenshot_*.png

      - name: Push results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w 0 fxcm_token_log.txt)
          # Check if file exists
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt?ref=claude/fix-demo-database-b3FtT" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          if [ -n "$SHA" ]; then
            curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt" \
              -d "{\"message\":\"ci: FXCM token retrieval results\",\"content\":\"$CONTENT\",\"branch\":\"claude/fix-demo-database-b3FtT\",\"sha\":\"$SHA\"}"
          else
            curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/fxcm_token_log.txt" \
              -d "{\"message\":\"ci: FXCM token retrieval results\",\"content\":\"$CONTENT\",\"branch\":\"claude/fix-demo-database-b3FtT\"}"
          fi
