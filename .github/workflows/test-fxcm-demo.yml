name: Test FXCM Demo

on:
  push:
    branches: [claude/fix-demo-database-b3FtT]

jobs:
  test-fxcm-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest test_demo -v

      - name: Test FXCM live data download (candledata.fxcorporate.com)
        run: |
          python3 -c "
          import urllib.request, gzip, csv, io

          # Test 1: Download EURUSD H1 data
          url = 'https://candledata.fxcorporate.com/H1/EURUSD/2020/1.csv.gz'
          print(f'Downloading: {url}')
          req = urllib.request.Request(url, headers={'User-Agent': 'ToolBoxPro/1.0'})
          resp = urllib.request.urlopen(req, timeout=30)
          raw = resp.read()
          text = gzip.decompress(raw).decode('utf-8')
          reader = csv.DictReader(io.StringIO(text))
          rows = list(reader)
          print(f'EURUSD H1: {len(rows)} rows downloaded')
          assert len(rows) > 0, 'No data downloaded'
          print(f'First row: {rows[0]}')
          print(f'Last row: {rows[-1]}')
          print('TEST 1 PASSED: EURUSD H1 data OK')

          # Test 2: Download USDJPY m1 data
          url2 = 'https://candledata.fxcorporate.com/m1/USDJPY/2020/1.csv.gz'
          print(f'\nDownloading: {url2}')
          req2 = urllib.request.Request(url2, headers={'User-Agent': 'ToolBoxPro/1.0'})
          resp2 = urllib.request.urlopen(req2, timeout=30)
          raw2 = resp2.read()
          text2 = gzip.decompress(raw2).decode('utf-8')
          rows2 = list(csv.DictReader(io.StringIO(text2)))
          print(f'USDJPY m1: {len(rows2)} rows downloaded')
          assert len(rows2) > 0, 'No data downloaded'
          print('TEST 2 PASSED: USDJPY m1 data OK')

          # Test 3: Download GBPUSD D1 data
          url3 = 'https://candledata.fxcorporate.com/D1/GBPUSD/2020.csv.gz'
          print(f'\nDownloading: {url3}')
          req3 = urllib.request.Request(url3, headers={'User-Agent': 'ToolBoxPro/1.0'})
          resp3 = urllib.request.urlopen(req3, timeout=30)
          raw3 = resp3.read()
          text3 = gzip.decompress(raw3).decode('utf-8')
          rows3 = list(csv.DictReader(io.StringIO(text3)))
          print(f'GBPUSD D1: {len(rows3)} rows downloaded')
          assert len(rows3) > 0, 'No data downloaded'
          print('TEST 3 PASSED: GBPUSD D1 data OK')

          print('\n=== ALL LIVE FXCM DATA TESTS PASSED ===')
          "

      - name: Run full demo against live FXCM data
        run: |
          python3 demo.py -s EURUSD -p D1 -y 2020
          echo "---"
          python3 demo.py --list
