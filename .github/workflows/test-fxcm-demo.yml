name: Test FXCM Demo

on:
  push:
    branches: [claude/fix-demo-database-b3FtT]

jobs:
  test-fxcm-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest test_demo -v

      - name: Debug - test network connectivity
        run: |
          echo "=== Testing DNS ==="
          nslookup candledata.fxcorporate.com || true
          echo "=== Testing curl ==="
          curl -sI https://candledata.fxcorporate.com/H1/EURUSD/2020/1.csv.gz || true
          curl -sI https://candledata.fxcorporate.com/m1/EURUSD/2017/29.csv.gz || true
          curl -sI https://candledata.fxcorporate.com/D1/EURUSD/2020.csv.gz || true
          echo "=== Testing alternative years ==="
          for year in 2017 2018 2019 2020; do
            echo -n "$year week 1: "
            curl -so /dev/null -w "%{http_code}" "https://candledata.fxcorporate.com/H1/EURUSD/$year/1.csv.gz" || true
            echo ""
          done

      - name: Test FXCM live data download
        run: |
          python3 << 'PYEOF'
          import urllib.request, gzip, csv, io, sys, traceback

          urls = [
              ("EURUSD H1 2017w29", "https://candledata.fxcorporate.com/H1/EURUSD/2017/29.csv.gz"),
              ("EURUSD H1 2020w1",  "https://candledata.fxcorporate.com/H1/EURUSD/2020/1.csv.gz"),
              ("EURUSD m1 2017w29", "https://candledata.fxcorporate.com/m1/EURUSD/2017/29.csv.gz"),
              ("EURUSD D1 2020",    "https://candledata.fxcorporate.com/D1/EURUSD/2020.csv.gz"),
              ("USDJPY H1 2018w10", "https://candledata.fxcorporate.com/H1/USDJPY/2018/10.csv.gz"),
          ]

          passed = 0
          for name, url in urls:
              print(f"\n--- Testing: {name} ---")
              print(f"URL: {url}")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  resp = urllib.request.urlopen(req, timeout=30)
                  raw = resp.read()
                  print(f"  Downloaded: {len(raw)} bytes")
                  text = gzip.decompress(raw).decode("utf-8")
                  rows = list(csv.DictReader(io.StringIO(text)))
                  print(f"  Rows: {len(rows)}")
                  if rows:
                      print(f"  Columns: {list(rows[0].keys())}")
                      print(f"  First: {rows[0]}")
                      print(f"  Last:  {rows[-1]}")
                      passed += 1
                      print(f"  PASSED")
                  else:
                      print(f"  FAILED: no rows")
              except Exception as e:
                  print(f"  FAILED: {e}")
                  traceback.print_exc()

          print(f"\n=== Results: {passed}/{len(urls)} tests passed ===")
          if passed == 0:
              sys.exit(1)
          PYEOF

      - name: Run full demo against live FXCM data
        if: success()
        run: |
          python3 demo.py -s EURUSD -p D1 -y 2020 || python3 demo.py -s EURUSD -p H1 -d 2017-07-20
          echo "---"
          python3 demo.py --list
