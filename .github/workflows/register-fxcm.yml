name: Register FXCM Demo Account

on:
  workflow_dispatch:
  push:
    branches: [claude/fix-demo-database-b3FtT]
    paths:
      - '.github/workflows/register-fxcm.yml'

jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fix-demo-database-b3FtT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run registration attempt and save results
        run: |
          python3 << 'PYEOF'
          import requests, json, random, string, time, re

          log = []
          def p(msg):
              print(msg)
              log.append(str(msg))

          p("=" * 60)
          p("STEP 1: Create temp email via mail.tm")
          p("=" * 60)

          resp = requests.get("https://api.mail.tm/domains")
          domains = resp.json()
          if "hydra:member" in domains:
              domain = domains["hydra:member"][0]["domain"]
          else:
              domain = domains[0]["domain"]
          p(f"Domain: {domain}")

          username = "fxcmtest" + "".join(random.choices(string.ascii_lowercase + string.digits, k=8))
          email = f"{username}@{domain}"
          mail_pass = "Test" + "".join(random.choices(string.ascii_letters + string.digits, k=12)) + "!1"
          p(f"Email: {email}")
          p(f"Password: {mail_pass}")

          resp = requests.post("https://api.mail.tm/accounts", json={"address": email, "password": mail_pass})
          p(f"Create status: {resp.status_code}")
          p(f"Response: {resp.text[:300]}")

          mail_token = ""
          if resp.status_code in [200, 201]:
              resp2 = requests.post("https://api.mail.tm/token", json={"address": email, "password": mail_pass})
              p(f"Token status: {resp2.status_code}")
              mail_token = resp2.json().get("token", "")
              p("Temp email created OK!")
          else:
              p("FAILED to create temp email")

          p("")
          p("=" * 60)
          p("STEP 2: Access FXCM registration pages")
          p("=" * 60)

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"})

          urls_to_try = [
              "https://www.fxcm.com/markets/open-demo/",
              "https://www.fxcm.com/uk/forex-trading-demo/",
              "https://www.fxcm.com/eu/platforms/trading-station/free-demo/",
              "https://www.fxcm-markets.com/forex-trading-demo/",
          ]

          for url in urls_to_try:
              try:
                  resp = session.get(url, timeout=15, allow_redirects=True)
                  p(f"[{resp.status_code}] GET {url}")
                  p(f"  Final URL: {resp.url}")
                  if resp.status_code == 200:
                      text = resp.text
                      forms = re.findall(r'<form[^>]*action=["\']([^"\']*)["\']', text, re.I)
                      inputs = re.findall(r'<input[^>]*name=["\']([^"\']*)["\']', text, re.I)
                      apis = re.findall(r'https?://[^\s"\'<>]*(?:api|register|signup|demo|lead|account|submit)[^\s"\'<>]*', text, re.I)
                      iframes = re.findall(r'<iframe[^>]*src=["\']([^"\']*)["\']', text, re.I)
                      p(f"  Forms: {forms[:10]}")
                      p(f"  Inputs: {inputs[:20]}")
                      p(f"  APIs found: {list(set(apis))[:15]}")
                      p(f"  Iframes: {iframes[:5]}")
                      # Look for JS-based form submission endpoints
                      js_urls = re.findall(r'["\'](/api/[^"\']*|https?://[^"\']*(?:api|lead|register|signup)[^"\']*)["\']', text)
                      p(f"  JS endpoints: {list(set(js_urls))[:15]}")
              except Exception as e:
                  p(f"[ERROR] GET {url}: {e}")

          p("")
          p("=" * 60)
          p("STEP 3: Try FXCM API registration endpoints")
          p("=" * 60)

          api_endpoints = [
              "https://www.fxcm.com/api/demo-account",
              "https://www.fxcm.com/api/register",
              "https://www.fxcm.com/api/lead",
              "https://www.fxcm.com/api/v1/demo",
              "https://api.fxcm.com/register",
              "https://api.fxcm.com/demo",
              "https://tradingstation.fxcm.com/api/register",
              "https://www.fxcm.com/markets/api/demo-account",
              "https://www.fxcm-markets.com/api/demo-account",
              "https://www.fxcm-markets.com/api/register",
          ]

          reg_data = {
              "firstName": "Test",
              "lastName": "Developer",
              "email": email,
              "country": "US",
              "countryCode": "US",
              "phone": "+12025551234",
              "phoneNumber": "+12025551234",
          }

          for url in api_endpoints:
              try:
                  resp = session.post(url, json=reg_data, timeout=10)
                  p(f"[{resp.status_code}] POST {url}")
                  p(f"  Response: {resp.text[:500]}")
              except Exception as e:
                  p(f"[ERROR] POST {url}: {e}")

          # Also try form-encoded
          p("\nTrying form-encoded...")
          for url in api_endpoints[:3]:
              try:
                  resp = session.post(url, data=reg_data, timeout=10)
                  p(f"[{resp.status_code}] POST(form) {url}")
                  p(f"  Response: {resp.text[:500]}")
              except Exception as e:
                  p(f"[ERROR] POST(form) {url}: {e}")

          p("")
          p("=" * 60)
          p("STEP 4: Check temp email inbox")
          p("=" * 60)

          if mail_token:
              headers = {"Authorization": f"Bearer {mail_token}"}
              for i in range(6):
                  p(f"Check {i+1}/6...")
                  resp = requests.get("https://api.mail.tm/messages", headers=headers)
                  messages = resp.json()
                  items = messages.get("hydra:member", [])
                  p(f"  Messages: {len(items)}")
                  for msg in items:
                      p(f"  From: {msg.get('from', {}).get('address', 'N/A')}")
                      p(f"  Subject: {msg.get('subject', 'N/A')}")
                      msg_resp = requests.get(f"https://api.mail.tm/messages/{msg['id']}", headers=headers)
                      full = msg_resp.json()
                      body = full.get("text", "") or full.get("html", [""])[0] if full.get("html") else ""
                      p(f"  Body: {body[:1000]}")
                  if items:
                      break
                  time.sleep(10)
          else:
              p("No mail token, skipping inbox check")

          # Write results to file
          with open("fxcm_registration_log.txt", "w") as f:
              f.write("\n".join(log))
          p("\nResults saved to fxcm_registration_log.txt")
          PYEOF

      - name: Commit results
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add fxcm_registration_log.txt
          git commit -m "ci: FXCM registration attempt results" || echo "No changes"
          git push origin claude/fix-demo-database-b3FtT || echo "Push failed"
