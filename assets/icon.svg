<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#FF6584"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench -->
    <path d="M-60,-80 L-20,-40 L-60,0 L-100,-40 Z" fill="white" stroke="none" opacity="0.9"/>
    <line x1="-60" y1="0" x2="-60" y2="80" stroke="white" stroke-width="32"/>
    <!-- Gear -->
    <circle cx="60" cy="0" r="45" stroke="white" fill="none" stroke-width="24"/>
    <circle cx="60" cy="0" r="18" fill="white" stroke="none"/>
    <!-- Gear teeth -->
    <line x1="60" y1="-70" x2="60" y2="-50" stroke="white" stroke-width="20"/>
    <line x1="60" y1="50" x2="60" y2="70" stroke="white" stroke-width="20"/>
    <line x1="110" y1="0" x2="130" y2="0" stroke="white" stroke-width="20"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="white" stroke-width="20"/>
  </g>
  <text x="256" y="440" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="72" font-weight="800">TB</text>
</svg>
